<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% seo %}
    {% feed_meta %}
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="32x32">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

    <header>
        <h1><a href="{{ '/' | relative_url }}">{{ site.title | escape }}</a></h1>
        {% if site.description %}
            <p>{{ site.description | escape }}</p>
        {% endif %}
        {% include navigation.html %}
    </header>

    <main>
        {{ content }}
    </main>

    <footer>
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.title | escape }}. <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
    </footer>

</body>
</html>
