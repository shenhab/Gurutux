{%- assign share_url = page.url | absolute_url -%}
<div class="share">
  <span class="share-label">Share</span>
  <a class="btn" href="https://www.linkedin.com/sharing/share-offsite/?url={{ share_url | url_encode }}" target="_blank" rel="noopener noreferrer">LinkedIn</a>
  <button type="button" class="btn" data-copy-link="{{ share_url }}">Copy link</button>
</div>
